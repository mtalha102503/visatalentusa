<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="H-1B visa stamping search demand by month: December is the peak season">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#dbg)" rx="16"/>

  <text x="600" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#1e3a8a">When Do People Search "H-1B Visa Stamping"?</text>
  <text x="600" y="98" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#64748b">Google Trends interest, US, past 12 months (relative scale 0–100)</text>

  <!-- chart area -->
  <!-- months: Oct Nov Dec Jan Feb Mar Apr May Jun Jul Aug Sep -->
  <!-- values (relative): 55, 70, 100, 95, 45, 67, 32, 24, 40, 35, 38, 26 -->
  <g font-family="system-ui, sans-serif">
    <!-- baseline -->
    <line x1="90" y1="470" x2="1120" y2="470" stroke="#94a3b8" stroke-width="2"/>

    <!-- Oct -->
    <rect x="105" y="330" width="62" height="140" rx="6" fill="#93c5fd"/>
    <text x="136" y="490" text-anchor="middle" font-size="16" fill="#475569">Oct</text>
    <text x="136" y="315" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">55</text>

    <!-- Nov -->
    <rect x="182" y="290" width="62" height="180" rx="6" fill="#93c5fd"/>
    <text x="213" y="490" text-anchor="middle" font-size="16" fill="#475569">Nov</text>
    <text x="213" y="275" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">70</text>

    <!-- Dec (peak) -->
    <rect x="259" y="212" width="62" height="258" rx="6" fill="#1d4ed8"/>
    <text x="290" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">Dec</text>
    <text x="290" y="197" text-anchor="middle" font-size="16" font-weight="800" fill="#1d4ed8">100</text>
    <text x="290" y="180" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">PEAK</text>

