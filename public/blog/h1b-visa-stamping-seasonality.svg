  <!-- insight box -->
  <rect x="90" y="545" width="1020" height="55" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="580" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#1e3a8a">Demand surges 4x in Dec–Jan (holiday travel home) — book your slot 6–8 weeks before December</text>

  <text x="600" y="622" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#93c5fd">VisaTalentUSA.com • Source: Google Trends, US, Oct 2025 – Sep 2026</text>
</svg>
