    <text x="444" y="490" text-anchor="middle" font-size="16" fill="#475569">Feb</text>
    <text x="444" y="340" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">45</text>

    <!-- Mar -->
    <rect x="490" y="300" width="62" height="170" rx="6" fill="#93c5fd"/>
    <text x="521" y="490" text-anchor="middle" font-size="16" fill="#475569">Mar</text>
    <text x="521" y="285" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a8a">67</text>
