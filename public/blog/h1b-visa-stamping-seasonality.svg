    <text x="675" y="490" text-anchor="middle" font-size="16" fill="#475569">May</text>
    <text x="675" y="395" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">24</text>

    <!-- Jun -->
    <rect x="721" y="368" width="62" height="102" rx="6" fill="#dbeafe"/>
    <text x="752" y="490" text-anchor="middle" font-size="16" fill="#475569">Jun</text>
    <text x="752" y="353" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">40</text>

    <!-- Jul -->
    <rect x="798" y="381" width="62" height="89" rx="6" fill="#dbeafe"/>
    <text x="829" y="490" text-anchor="middle" font-size="16" fill="#475569">Jul</text>
    <text x="829" y="366" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">35</text>

    <!-- Aug -->
    <rect x="875" y="373" width="62" height="97" rx="6" fill="#dbeafe"/>
    <text x="906" y="490" text-anchor="middle" font-size="16" fill="#475569">Aug</text>
    <text x="906" y="358" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">38</text>

    <!-- Sep -->
    <rect x="952" y="404" width="62" height="66" rx="6" fill="#dbeafe"/>
    <text x="983" y="490" text-anchor="middle" font-size="16" fill="#475569">Sep</text>
    <text x="983" y="389" text-anchor="middle" font-size="15" font-weight="700" fill="#64748b">26</text>
