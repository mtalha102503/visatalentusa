<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1200" height="1180" fill="#ffffff"/>
  <text x="60" y="60" font-size="30" font-weight="700" fill="#071228">The $100,000 H-1B fee - from proclamation to three appeals courts</text>
  <text x="60" y="100" font-size="22" font-weight="700" fill="#15803d">Status as of October 25, 2026: BLOCKED - not being collected</text>
  <line x1="60" y1="150" x2="60" y2="1090" stroke="#cbd5e1" stroke-width="3"/>
  <g font-size="21">
    <circle cx="60" cy="170" r="11" fill="#475569"/>
    <text x="100" y="164" font-weight="700" fill="#071228">Sep 19, 2025</text>
    <text x="100" y="192" fill="#334155">Proclamation 10973 creates the $100,000 payment</text>

    <circle cx="60" cy="265" r="11" fill="#475569"/>
    <text x="100" y="259" font-weight="700" fill="#071228">Sep 21, 2025</text>
    <text x="100" y="287" fill="#334155">Fee takes effect (12:01 a.m. EDT)</text>

    <circle cx="60" cy="360" r="11" fill="#475569"/>
    <text x="100" y="354" font-weight="700" fill="#071228">Oct 20, 2025</text>
    <text x="100" y="382" fill="#334155">USCIS defines who pays and who does not</text>

    <circle cx="60" cy="455" r="11" fill="#475569"/>
    <text x="100" y="449" font-weight="700" fill="#071228">Dec 23, 2025</text>
    <text x="100" y="477" fill="#334155">D.C. court upholds the fee (Chamber v. DHS)</text>

    <circle cx="60" cy="550" r="11" fill="#15803d"/>
    <text x="100" y="544" font-weight="700" fill="#071228">Jun 8, 2026</text>
    <text x="100" y="572" fill="#334155">Boston court vacates the policy nationwide</text>

    <circle cx="60" cy="645" r="11" fill="#15803d"/>
    <text x="100" y="639" font-weight="700" fill="#071228">Jul 24, 2026</text>
    <text x="100" y="667" fill="#334155">First Circuit refuses to pause the vacatur</text>

    <circle cx="60" cy="740" r="11" fill="#b45309"/>
    <text x="100" y="734" font-weight="700" fill="#071228">Aug 25, 2026</text>
    <text x="100" y="762" fill="#334155">DHS proposes a separate $103,265 fee (not in effect)</text>

    <circle cx="60" cy="835" r="11" fill="#475569"/>
    <text x="100" y="829" font-weight="700" fill="#071228">Sep 18, 2026</text>
    <text x="100" y="857" fill="#334155">Proclamation extended through Sep 21, 2027</text>

    <circle cx="60" cy="930" r="11" fill="#15803d"/>
    <text x="100" y="924" font-weight="700" fill="#071228">Sep 30, 2026</text>
    <text x="100" y="952" fill="#334155">California blocks enforcement under both proclamations</text>

    <circle cx="60" cy="1025" r="11" fill="#1d4ed8"/>
    <text x="100" y="1019" font-weight="700" fill="#071228">Oct 9, 2026</text>
    <text x="100" y="1047" fill="#334155">Government appeals to the Ninth Circuit, seeks a stay</text>
  </g>
  <text x="60" y="1135" font-size="18" fill="#64748b">Full timeline + sources: visatalentusa.com/blog/h1b-100k-fee-status</text>
</svg>
