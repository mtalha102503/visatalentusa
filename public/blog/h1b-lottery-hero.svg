<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="H-1B lottery guide concept illustration">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#hbg)" rx="16"/>

  <!-- decorative circles -->
  <circle cx="1050" cy="120" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="150" cy="520" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="950" cy="500" r="60" fill="#ffffff" opacity="0.07"/>

  <!-- title -->
  <text x="600" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="56" font-weight="800" fill="#ffffff">H-1B LOTTERY</text>
  <text x="600" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#bfdbfe">Complete Guide: Process, Results &amp; Odds</text>

  <!-- stat cards -->
  <g transform="translate(150, 220)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#card)" opacity="0.95"/>
    <text x="135" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">85K</text>
    <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Annual Visa Cap</text>
    <text x="135" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">65K + 20K master's</text>
  </g>
  <g transform="translate(465, 220)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#card)" opacity="0.95"/>
    <text x="135" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">400K+</text>
    <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Registrations</text>
    <text x="135" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">competing each year</text>
  </g>
  <g transform="translate(780, 220)">
    <rect x="0" y="0" width="270" height="180" rx="12" fill="url(#card)" opacity="0.95"/>
    <text x="135" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="52" font-weight="800" fill="#1e3a8a">$215</text>
    <text x="135" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Registration Fee</text>
    <text x="135" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" fill="#64748b">per beneficiary</text>
  </g>

  <!-- bottom steps -->
  <g font-family="system-ui, sans-serif">
    <text x="200" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1. Register</text>
    <text x="200" y="510" text-anchor="middle" font-size="16" fill="#bfdbfe">March window</text>
    <text x="450" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2. Lottery Draw</text>
    <text x="450" y="510" text-anchor="middle" font-size="16" fill="#bfdbfe">Random selection</text>
    <text x="700" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3. Results</text>
    <text x="700" y="510" text-anchor="middle" font-size="16" fill="#bfdbfe">By March 31</text>
    <text x="950" y="480" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">4. File Petition</text>
    <text x="950" y="510" text-anchor="middle" font-size="16" fill="#bfdbfe">If selected</text>
  </g>

  <!-- brand -->
  <text x="600" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#93c5fd">VisaTalentUSA.com</text>
</svg>
