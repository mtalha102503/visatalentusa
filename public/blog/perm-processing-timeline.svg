<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1628"/>
      <stop offset="1" stop-color="#13253f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d4a843"/>
      <stop offset="1" stop-color="#f0c96a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)" rx="0"/>
  
  <!-- Header -->
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="16" fill="#8899aa" letter-spacing="2">VISATALENTUSA.COM</text>
  <rect x="60" y="90" width="80" height="4" fill="url(#gold)"/>
  <text x="60" y="140" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#ffffff">PERM Processing Timeline 2026</text>
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="18" fill="#aabbcc">From PWD request to certified ETA-9089 — with current DOL times</text>
  
  <!-- Timeline track -->
  <rect x="60" y="250" width="1080" height="8" rx="4" fill="#1e3a5f"/>
  <rect x="60" y="250" width="1080" height="8" rx="4" fill="url(#gold)" opacity="0.35"/>
  
  <!-- Stage 1: PWD -->
  <circle cx="150" cy="254" r="22" fill="#1a56db" stroke="#d4a843" stroke-width="3"/>
  <text x="150" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="60" y="300" width="220" height="200" rx="12" fill="#13253f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="170" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Prevailing Wage</text>
  <text x="170" y="363" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Determination</text>
  <text x="170" y="405" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#f0c96a" text-anchor="middle">4–8 mo</text>
  <text x="170" y="435" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">DOL at June 2026 filings</text>
  <text x="170" y="458" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">~49K requests pending</text>
  
  <!-- Stage 2: Recruitment -->
  <circle cx="420" cy="254" r="22" fill="#1a56db" stroke="#d4a843" stroke-width="3"/>
  <text x="420" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="310" y="300" width="220" height="200" rx="12" fill="#13253f" stroke="#2a4a73" stroke-width="1.5"/>
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Recruitment</text>
  <text x="420" y="363" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">(mandatory)</text>
  <text x="420" y="405" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#f0c96a" text-anchor="middle">2–3 mo</text>
  <text x="420" y="435" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">Ads + 30-day SWA +</text>
  <text x="420" y="458" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">30-day cooling period</text>
  
  <!-- Stage 3: Analyst Review -->
  <circle cx="690" cy="254" r="22" fill="#1a56db" stroke="#d4a843" stroke-width="3"/>
  <text x="690" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
  <rect x="560" y="300" width="260" height="200" rx="12" fill="#13253f" stroke="#d4a843" stroke-width="2"/>
  <text x="690" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">ETA-9089 Analyst</text>
  <text x="690" y="363" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Review</text>
  <text x="690" y="405" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#f0c96a" text-anchor="middle">336 days</text>
  <text x="690" y="435" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">~11 months avg (Aug 2026)</text>
  <text x="690" y="458" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">At Dec 2025 priority dates</text>
  
  <!-- Stage 4: Audit -->
  <circle cx="980" cy="254" r="22" fill="#7c2d12" stroke="#d4a843" stroke-width="3"/>
  <text x="980" y="261" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
  <rect x="850" y="300" width="290" height="200" rx="12" fill="#1a1a2e" stroke="#7c2d12" stroke-width="1.5"/>
  <text x="995" y="340" font-family="Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffffff" text-anchor="middle">Audit Review</text>
  <text x="995" y="363" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">(if selected)</text>
  <text x="995" y="405" font-family="Arial, sans-serif" font-size="34" font-weight="bold" fill="#e07856" text-anchor="middle">+ months</text>
  <text x="995" y="435" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">Separate slower queue</text>
  <text x="995" y="458" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="middle">Also at Dec 2025 dates</text>
  
  <!-- Total -->
  <rect x="60" y="530" width="1080" height="60" rx="10" fill="#0d1b2e" stroke="#d4a843" stroke-width="1.5"/>
  <text x="90" y="567" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Total end-to-end: 17–22 months</text>
  <text x="560" y="567" font-family="Arial, sans-serif" font-size="20" fill="#e07856">22–30 months with audit</text>
  <text x="1050" y="567" font-family="Arial, sans-serif" font-size="14" fill="#8899aa" text-anchor="end">Source: DOL FLAG, Oct 2026</text>
</svg>
