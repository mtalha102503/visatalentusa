<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="H-1B visa stamping process timeline: 6 steps from I-797 approval to passport return">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sbg)" rx="16"/>

  <text x="600" y="64" text-anchor="middle" font-family="system-ui, sans-serif" font-size="38" font-weight="800" fill="#1e3a8a">H-1B Visa Stamping: 6-Step Process</text>
  <text x="600" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" fill="#64748b">From petition approval to stamped passport in hand</text>

  <!-- timeline line -->
  <line x1="70" y1="270" x2="1130" y2="270" stroke="#3b82f6" stroke-width="4"/>

  <!-- step 1 -->
  <g>
    <circle cx="150" cy="270" r="34" fill="#1d4ed8"/>
    <text x="150" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">1</text>
    <text x="150" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">I-797 Approval</text>
    <text x="150" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Employer petition</text>
    <text x="150" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">approved by USCIS</text>
  </g>

  <!-- step 2 -->
  <g>
    <circle cx="340" cy="270" r="34" fill="#1d4ed8"/>
    <text x="340" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">2</text>
    <text x="340" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">DS-160 Form</text>
    <text x="340" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Online application</text>
    <text x="340" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">+ photo upload</text>
  </g>

  <!-- step 3 -->
  <g>
    <circle cx="530" cy="270" r="34" fill="#1d4ed8"/>
    <text x="530" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">3</text>
    <text x="530" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Pay + Schedule</text>
    <text x="530" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">$205 MRV fee</text>
    <text x="530" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">ustraveldocs.com/in</text>
  </g>

  <!-- step 4 -->
  <g>
    <circle cx="720" cy="270" r="34" fill="#1d4ed8"/>
    <text x="720" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">4</text>
    <text x="720" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">VAC Biometrics</text>
    <text x="720" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Fingerprints + photo</text>
    <text x="720" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">at Visa Application Center</text>
  </g>

  <!-- step 5 -->
  <g>
    <circle cx="910" cy="270" r="34" fill="#1d4ed8"/>
    <text x="910" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">5</text>
    <text x="910" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Consulate Interview</text>
    <text x="910" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">US Embassy / Consulate</text>
    <text x="910" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">(or Dropbox waiver)</text>
  </g>

  <!-- step 6 -->
  <g>
    <circle cx="1085" cy="270" r="34" fill="#1d4ed8"/>
    <text x="1085" y="282" text-anchor="middle" font-family="system-ui, sans-serif" font-size="26" font-weight="800" fill="#ffffff">6</text>
    <text x="1085" y="345" text-anchor="middle" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#1e3a8a">Passport Return</text>
    <text x="1085" y="372" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Stamped visa issued</text>
    <text x="1085" y="394" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Track on CEAC</text>
  </g>

  <!-- 5 posts note -->
  <rect x="330" y="455" width="540" height="80" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="600" y="488" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e3a8a">5 US posts in India: New Delhi • Mumbai • Chennai • Hyderabad • Kolkata</text>
  <text x="600" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">Plan 6–8 weeks ahead — December slots fill fastest</text>

  <text x="600" y="600" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#93c5fd">VisaTalentUSA.com</text>
</svg>
