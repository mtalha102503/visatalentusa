<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="H-1B lottery 2028 guide concept illustration">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.6" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ticket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#hbg)" rx="16"/>

  <!-- decorative circles -->
  <circle cx="1050" cy="120" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="150" cy="520" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="950" cy="500" r="60" fill="#ffffff" opacity="0.07"/>

  <!-- lottery tickets -->
  <g transform="translate(180, 220)">
    <rect x="0" y="0" width="130" height="190" rx="12" fill="url(#ticket)" opacity="0.95"/>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">1×</text>
    <text x="65" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Level I</text>
    <text x="65" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#dc2626">~15%</text>
  </g>
  <g transform="translate(350, 220)">
    <rect x="0" y="0" width="130" height="190" rx="12" fill="url(#ticket)" opacity="0.95"/>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">2×</text>
    <text x="65" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Level II</text>
    <text x="65" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#ea580c">~31%</text>
  </g>
  <g transform="translate(520, 220)">
    <rect x="0" y="0" width="130" height="190" rx="12" fill="url(#ticket)" opacity="0.95"/>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">3×</text>
    <text x="65" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Level III</text>
    <text x="65" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#2563eb">~46%</text>
  </g>
  <g transform="translate(690, 220)">
    <rect x="0" y="0" width="130" height="190" rx="12" fill="url(#ticket)" opacity="0.98" stroke="#fbbf24" stroke-width="4"/>
    <text x="65" y="70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#1e3a8a">4×</text>
    <text x="65" y="110" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" fill="#64748b">Level IV</text>
    <text x="65" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="600" fill="#059669">~61%</text>
  </g>

  <text x="600" y="90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="40" font-weight="800" fill="#ffffff">H-1B Lottery 2028</text>
  <text x="600" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#bfdbfe">Wage-weighted selection: more pay, more entries</text>

  <text x="600" y="480" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#bfdbfe">Based on 2M+ real DOL filing records</text>
  <text x="600" y="560" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#ffffff">visatalentusa.com</text>
</svg>
